<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OEE Linka</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f4;--sf:#fff;--tx:#14202b;--mu:#5d6b78;--ln:#d3dae1;--ac:#0b5cad;--ok:#1b7f4b;--bad:#c0392b;--wn:#b36b00;--bw:#fff1e6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10171d;--sf:#18222b;--tx:#e8eef3;--mu:#93a3b0;--ln:#2c3a46;--ac:#5aa6ee;--ok:#4cc58a;--bad:#ff7b6b;--wn:#f0b45a;--bw:#2b2118}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:12px}
button,input,select{font:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ln)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{width:100%;padding:8px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.big{font-size:44px;font-weight:700;line-height:1.1}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k{border:1px solid var(--ln);border-radius:6px;padding:10px}
.k small{display:block;color:var(--mu)}.k b{font-size:22px}
.err{border-left:5px solid var(--bad);background:var(--bw);padding:12px;border-radius:6px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln)}
.scroll{overflow-x:auto}
.demo{font-size:13px;color:var(--mu);margin-top:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<section id="login" class="box hide" style="max-width:380px;margin:8vh auto 0">
<h1>OEE Linka</h1>
<p class="demo">Uzavretá stránka pre zamestnancov. Registrácia nie je, účty vytvára vedúci.</p>
<label for="u">Prihlasovacie meno</label><input id="u" autocomplete="username">
<label for="p">Heslo</label><input id="p" type="password" autocomplete="current-password">
<p id="lerr" class="bad hide"></p>
<p><button id="lbtn" onclick="login()" style="width:100%">Prihlásiť sa</button></p>
</section>

<main id="app" class="hide">
<header>
<div><h1 id="title">Zmena</h1><span id="who" class="demo"></span></div>
<button class="g" onclick="logout()">Odhlásiť sa</button>
</header>
<nav class="tabs" id="tabs"></nav>

<div id="v-home">
<div class="box">
<h2>Stav zmeny</h2>
<div class="row"><span class="big" id="oee"></span><span id="goal"></span><b id="delta"></b></div>
<div class="grid" style="margin-top:10px">
<div class="k"><small>Availability (A)</small><b id="kA"></b></div>
<div class="k"><small>Performance (P)</small><b id="kP"></b></div>
<div class="k"><small>Quality (Q)</small><b id="kQ"></b></div>
</div>
</div>
<div class="box"><h2 id="errT"></h2><div id="errs"></div></div>
<div class="box"><h2>Tabuľka OEE</h2><div class="scroll"><table id="tbl"></table></div></div>
<p id="herr" class="bad hide"></p>
</div>

<div id="v-users" class="hide">
<div class="box">
<h2>Vytvoriť účet</h2>
<label for="nu">Prihlasovacie meno</label><input id="nu" autocomplete="off">
<label for="np">Heslo (min. 8 znakov)</label><input id="np" type="password" autocomplete="new-password">
<label for="nr">Rola</label><select id="nr"><option>Pracovník</option><option>Vedúci</option></select>
<p id="uerr" class="bad hide"></p>
<p><button onclick="addUser()">Vytvoriť účet</button></p>
</div>
<div class="box"><h2>Účty</h2><div class="scroll"><table id="ut"></table></div></div>
<div class="box"><h2>Záznam prihlásení</h2><div id="log" class="demo">Zatiaľ prázdne.</div></div>
</div>
</main>
</div>

<script>
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(n){return n.toLocaleString("sk-SK").replace(/\u00a0/g,"&nbsp;")}
function pct(x){return (x*100).toLocaleString("sk-SK",{minimumFractionDigits:1,maximumFractionDigits:1})+"%"}

// ---------- API ----------
function api(path,method,body){
 var o={method:method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json"}};
 if(body)o.body=JSON.stringify(body);
 return fetch(path,o).then(function(r){
  return r.json().catch(function(){return null}).then(function(d){
   if(!r.ok){var e=new Error((d&&d.error)||"Chyba servera.");e.status=r.status;throw e}
   return d;
  });
 });
}

// ---------- Prihlásenie ----------
function showLogin(){
 $("app").classList.add("hide");$("login").classList.remove("hide");$("p").value="";
}
function login(){
 $("lerr").classList.add("hide");$("lbtn").disabled=true;
 api("/api/login","POST",{u:$("u").value.trim(),p:$("p").value})
  .then(enter)
  .catch(function(e){$("lerr").textContent=e.message;$("lerr").classList.remove("hide")})
  .then(function(){$("lbtn").disabled=false});
}
function logout(){api("/api/logout","POST").catch(function(){}).then(showLogin)}

function enter(me){
 $("login").classList.add("hide");$("app").classList.remove("hide");
 $("who").textContent=me.u+", "+me.r;
 var t=[["home","Prehľad"]];
 if(me.r==="Vedúci")t.push(["users","Účty"]);
 $("tabs").innerHTML=t.map(function(x,i){
  return '<button class="'+(i?'':'on')+'" data-v="'+x[0]+'">'+x[1]+'</button>';
 }).join("");
 [].forEach.call($("tabs").children,function(b){b.onclick=function(){show(b.dataset.v,b)}});
 show("home");
}
function show(n,btn){
 ["home","users"].forEach(function(v){$("v-"+v).classList.toggle("hide",v!==n)});
 if(btn){[].forEach.call($("tabs").children,function(b){b.classList.remove("on")});btn.classList.add("on")}
 if(n==="home")loadOee();
 if(n==="users")renderUsers();
}
function handle401(e){if(e.status===401){showLogin();return true}return false}

// ---------- Prehľad OEE ----------
function loadOee(){
 $("herr").classList.add("hide");
 api("/api/oee").then(function(d){
  $("title").textContent="Zmena: "+d.label;
  var diff=(d.oee-d.target)*100,good=diff>=0;
  $("oee").textContent=pct(d.oee);$("oee").className="big "+(good?"ok":"bad");
  $("goal").textContent="cieľ "+Math.round(d.target*100)+"%";
  $("delta").textContent=(good?"▲ náskok ":"▼ strata ")+Math.abs(diff).toLocaleString("sk-SK",{maximumFractionDigits:0})+" p. b.";
  $("delta").className=good?"ok":"bad";
  $("kA").textContent=pct(d.availability);$("kP").textContent=pct(d.performance);$("kQ").textContent=pct(d.quality);
  $("errT").textContent="Top "+d.topErrors.length+" chyby ("+d.shiftsCount+" ranných zmien)";
  $("errs").innerHTML=d.topErrors.map(function(e,i){
   return '<div class="err"><b>'+(i+1)+'. '+esc(e.code)+' | '+esc(e.title)+': '+e.minutes+' min</b><ol>'+
    e.steps.map(function(s){return '<li>'+esc(s)+'</li>'}).join("")+'</ol></div>';
  }).join("");
  $("tbl").innerHTML='<tr><th>Ukazovateľ</th><th>Hodnota</th><th>Výpočet</th></tr>'+
   '<tr><td><b>OEE</b></td><td><b>'+pct(d.oee)+'</b></td><td>A × P × Q</td></tr>'+
   '<tr><td>Availability</td><td>'+pct(d.availability)+'</td><td>('+num(d.plannedMin)+' − '+num(d.downtimeMin)+') / '+num(d.plannedMin)+' min</td></tr>'+
   '<tr><td>Performance</td><td>'+pct(d.performance)+'</td><td>'+num(d.produced)+' / '+num(d.idealProduced)+' ks</td></tr>'+
   '<tr><td>Quality</td><td>'+pct(d.quality)+'</td><td>'+num(d.ok)+' / '+num(d.produced)+' ks</td></tr>'+
   '<tr><td>Vyrobené kusy</td><td>'+num(d.produced)+'</td><td></td></tr>'+
   '<tr><td>OK kusy</td><td>'+num(d.ok)+'</td><td></td></tr>'+
   '<tr><td>NOK kusy</td><td>'+num(d.nok)+'</td><td></td></tr>'+
   '<tr><td>Prestoje (min)</td><td>'+num(d.downtimeMin)+'</td><td></td></tr>';
 }).catch(function(e){
  if(handle401(e))return;
  $("herr").textContent=e.message;$("herr").classList.remove("hide");
 });
}

// ---------- Účty (vedúci) ----------
function renderUsers(){
 api("/api/users").then(function(list){
  $("ut").innerHTML="<tr><th>Prihlasovacie meno</th><th>Rola</th></tr>"+
   list.map(function(x){return "<tr><td>"+esc(x.u)+"</td><td>"+esc(x.r)+"</td></tr>"}).join("");
 }).catch(handle401);
 api("/api/logins").then(function(l){
  $("log").textContent=l.length?l.map(function(x){
   return x.u+" ("+x.r+"): "+new Date(x.t).toLocaleString("sk-SK");
  }).join("; "):"Zatiaľ prázdne.";
 }).catch(handle401);
}
function addUser(){
 $("uerr").classList.add("hide");
 api("/api/users","POST",{u:$("nu").value.trim(),p:$("np").value,r:$("nr").value})
  .then(function(){$("nu").value="";$("np").value="";renderUsers()})
  .catch(function(e){
   if(handle401(e))return;
   $("uerr").textContent=e.message;$("uerr").classList.remove("hide");
  });
}

// ---------- Štart: over existujúcu reláciu ----------
api("/api/me").then(enter).catch(showLogin);
$("p").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
</script>
</body>
</html>
