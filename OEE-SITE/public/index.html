<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEEF1">
<title>OEE Improvement Engine · L01</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<!-- One screen, two modes: line view and table view share the header; the dark panel grows into the table. -->
<div id="app">
  <!-- ===== Top: shift sign, timeline (line) or table picker (table), controls ===== -->
  <header id="top">
    <section class="sign" aria-label="Shift information sign">
      <div class="sign-row">
        <div class="clock" id="clock">--:--</div>
        <div class="sign-shift"><div class="no" id="shift-no">--/--</div><div class="cap">SHIFT</div></div>
      </div>
      <div class="sign-bar"><i id="shift-progress"></i></div>
    </section>

    <div class="mid">
      <section class="tl-wrap" aria-label="Shift timeline">
        <div class="tl-date">
          <span>L01 ·</span>
          <label class="date-pick"><select id="shift-select" aria-label="Shift"></select>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></label>
          <span class="who"><span id="who"></span><button type="button" id="logout">LOG OUT</button></span>
          <div id="mode" class="mode" role="group" aria-label="Data source">
            <button type="button" data-mode="replay" class="on" aria-pressed="true" title="Play the recorded November shifts">REPLAY</button>
            <button type="button" data-mode="live" aria-pressed="false" title="Real clock, line generated minute by minute">LIVE</button>
          </div>
        </div>
        <div class="tl-grid" id="timeline" title="Click or drag to move the replay">
          <span class="tl-lab">STOPS</span><div class="lane" id="lane-stops"></div>
          <span class="tl-lab">SLOW MIN</span><div class="lane cells" id="lane-slow"></div>
          <span class="tl-lab">NOK PCS</span><div class="lane cells" id="lane-nok"></div>
        </div>
        <div class="tl-axis"><span>06:00</span><span>08:00</span><span>10:00</span><span>12:00</span><span>14:00</span></div>
      </section>

      <section class="tv-pick" aria-label="Table picker">
        <div class="tl-date"><span>L01 · TABLES · UP TO NOW</span><span id="tv-filter"></span></div>
        <div class="tv-pick-row">
          <nav id="tv-tabs" aria-label="Which table"></nav>
          <div class="tv-metrics">
            <button type="button" id="tv-metrics-btn" class="btn-dark tall" aria-haspopup="true" aria-expanded="false">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#FFFFFF" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="16" height="14"/><path d="M2 8h16M2 12.5h16M7.5 3v14M12.5 3v14"/></svg>Metrics <span id="tv-metrics-n" class="mn"></span>
              <svg class="chev" width="14" height="14" viewBox="0 0 12 12" fill="none" stroke="#FFFFFF" stroke-width="1.6" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg></button>
            <div id="tv-metrics" class="tv-pop" role="menu"></div>
          </div>
        </div>
      </section>
    </div>

    <section class="controls" aria-label="Replay controls">
      <div class="ctl-row">
        <button type="button" id="btn-play" class="btn-dark" title="Play / pause (Space)">Pause</button>
        <label class="speed-pick">
          <select id="speed" aria-label="Replay speed">
            <option value="1">1×</option><option value="60" selected>60×</option><option value="600">600×</option>
          </select>
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#24272C" stroke-width="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg>
        </label>
      </div>
      <button type="button" id="btn-table" class="btn-line">TABLE VIEW →</button>
    </section>
  </header>

  <!-- ===== Stage: the line (3D canvas behind, or the 2D schematic) ===== -->
  <main id="stage">
    <section id="stopped" class="stopped" aria-live="polite" aria-label="Stopped stations"></section>
    <div id="line2d" class="hidden" aria-label="Line L01"></div>
    <div class="legend" aria-hidden="true">
      <span><i class="dot ok"></i>RUN</span><span><i class="dot warn"></i>WAIT</span><span><i class="dot alert"></i>FAULT</span>
    </div>
  </main>

  <!-- ===== Bottom: data panel (can be lowered) ===== -->
  <footer id="bottom">
    <div class="tabs-row">
      <nav id="tabs" role="tablist" aria-label="Panel tabs">
        <button type="button" role="tab" data-tab="now" class="on">SHIFT NOW</button>
        <button type="button" role="tab" data-tab="loss">LOSSES</button>
        <button type="button" role="tab" data-tab="ai">INSIGHTS</button>
        <button type="button" role="tab" data-tab="month">MONTH</button>
      </nav>
      <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel" title="Lower or raise the panel">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 4l4 4 4-4"/></svg><span>HIDE</span></button>
    </div>
    <div id="panel">
      <div id="tab-now" class="tab"></div>
      <div id="tab-loss" class="tab hidden"></div>
      <div id="tab-ai" class="tab hidden"></div>
      <div id="tab-month" class="tab hidden"></div>
    </div>
  </footer>

  <!-- ===== Table view body: same dark panel, grown up to the header ===== -->
  <section id="tvbody" aria-label="Table view">
    <div class="tv-table"><table id="tv-table"></table><div id="tv-empty" class="tv-note hidden"></div></div>
    <div class="issues-wrap closed" id="issues-wrap">
      <button type="button" id="issues-btn" class="issues-strip" aria-expanded="false" aria-controls="issues" aria-label="Show issues">
        <svg width="20" height="80" viewBox="0 0 20 80" aria-hidden="true"><polygon points="19,1 1,40 19,79"/></svg></button>
      <aside id="issues" aria-label="Issues"><div class="issues-in" id="issues-in"></div></aside>
    </div>
  </section>
</div>

<!-- Focused station -->
<aside id="card" class="sheet" aria-live="polite"></aside>

<!-- How to fix -->
<div id="fix" role="dialog" aria-modal="true" aria-labelledby="fix-title">
  <div class="fix-box">
    <div class="fix-head"><span id="fix-title">How to fix</span><button type="button" id="fix-close" aria-label="Close">×</button></div>
    <div id="fix-body"></div>
  </div>
</div>

<div id="toasts"></div>
<div id="loading"><div class="ld-box"><em>Loading line L01</em><span id="ld-msg"></span></div></div>

<script type="module" src="/app.js"></script>
</body>
</html>
