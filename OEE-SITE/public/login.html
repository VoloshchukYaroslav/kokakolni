<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · OEE Improvement Engine · L01</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#ECEEF1;--panel:#2A2D33;--rule:#3D4148;--accent:#BCC2CA;--ink:#24272C;--ink-m:#6A7079;--on:#FFFFFF;--on-m:#A2A8B0;--line:#D3D7DD;--alert:#D0473D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 "IBM Plex Sans","Segoe UI",Arial,sans-serif}
main{min-height:100%;display:grid;place-items:center;padding:24px}
.box{width:400px;max-width:100%;background:var(--panel);color:var(--on);border-radius:6px;overflow:hidden}
.hd{padding:22px 26px 16px;border-bottom:6px solid var(--accent)}
.hd b{display:block;font:600 30px/1.05 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}
.hd small{display:block;margin-top:6px;font:400 12px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--on-m)}
form{padding:22px 26px 26px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--on-m)}
input{height:46px;padding:0 14px;border:1px solid var(--rule);background:#22252A;color:var(--on);font:500 16px/1 "IBM Plex Sans",sans-serif;border-radius:0}
input:focus{outline:3px solid var(--accent);outline-offset:0}
button{height:48px;border:0;background:var(--accent);color:var(--ink);font:600 16px/1 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;letter-spacing:.04em;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:20px;font-size:14px;color:#EE7B71}
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="hd"><b>OEE Improvement Engine</b><small>LINE L01 · SIGN IN</small></div>
    <form id="f" autocomplete="on">
      <label>Email<input id="email" type="email" autocomplete="username" required autofocus></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="go">SIGN IN</button>
    </form>
  </div>
</main>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    location.href = "/";
  } catch (x) { err.textContent = x.message; go.disabled = false; }
});
</script>
</body>
</html>
